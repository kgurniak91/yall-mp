<form [formGroup]="form" class="flex flex-column gap-4">
  <div class="flex flex-column gap-2">
    <label for="catalog-name" class="font-bold required">Catalog Name</label>
    <input pInputText
           id="catalog-name"
           formControlName="name"
           placeholder="e.g., &quot;Japanese&quot;, &quot;Money Heist&quot;"
           autofocus
           (keydown.enter)="onSave()" />

    <app-form-control-error [control]="form.get('name')"></app-form-control-error>
  </div>

  <div class="flex justify-content-end gap-2">
    <p-button label="Cancel" severity="secondary" icon="fa-solid fa-xmark" (onClick)="onCancel()"/>
    <p-button [label]="isEditMode() ? 'Rename' : 'Create'"
              severity="primary"
              icon="fa-solid fa-check"
              (onClick)="onSave()"/>
  </div>
</form>
