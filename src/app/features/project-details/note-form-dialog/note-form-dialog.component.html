<form [formGroup]="form" class="flex flex-column gap-4 mb-4">
  <div class="flex flex-column gap-2">
    <label for="term" class="font-bold">Term</label>
    <input pInputText
           id="term"
           formControlName="term"
           [readOnly]="!data.isTermEditable"
           [class.surface-200]="!data.isTermEditable"
           placeholder="e.g., specific word or phrase"/>
    @if (data.isTermEditable) {
      <small><b>Optional</b> - leave empty to add to &quot;General notes&quot;</small>
    }
    <app-form-control-error [control]="form.get('term')"/>
  </div>

  @if (data.mode !== 'rename-term') {
    <div class="flex flex-column gap-2">
      <label for="note" class="font-bold required">Note Content</label>
      <textarea pInputTextarea
                id="note"
                formControlName="noteText"
                [autoResize]="false"
                rows="5"
                placeholder="Enter your note here..."></textarea>
      <app-form-control-error [control]="form.get('noteText')"/>
    </div>
  }
</form>

<div class="flex align-items-center justify-content-end gap-2">
  <p-button label="Cancel" severity="secondary" icon="fa-solid fa-xmark" (click)="onCancel()"/>
  <p-button label="Save" severity="primary" icon="fa-solid fa-check" (click)="onSave()" data-primary-action/>
</div>
