<div class="resize-handle"
     title="Drag to change the timeline height"
     (pointerdown)="onResizeHandlePointerDown($event)"
     (pointermove)="onResizeHandlePointerMove($event)"
     (pointerup)="onResizeHandlePointerUp($event)"
     (pointercancel)="onResizeHandlePointerUp($event)"></div>

@if (videoStateService.isTimelineLoading()) {
  <div class="loader-wrapper">
    <app-spinner/>
    <p>
      Generating timeline...
    </p>
  </div>
}

<div [style.visibility]="videoStateService.isTimelineLoading() ? 'hidden' : 'visible'"
     id="timeline"
     #timeline
     (wheel)="onWheel($event)"></div>
