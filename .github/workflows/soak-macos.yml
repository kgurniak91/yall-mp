name: Soak (macOS)

# Manual only: memory and leak counters of the video path over a looped playback on the hosted macOS runner (software GL, readback)
on:
  workflow_dispatch:
    inputs:
      minutes:
        description: 'Length of the soak in minutes'
        default: '10'

jobs:
  soak:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install macOS dependencies
        run: brew install mpv cmake

      - run: npm ci

      - run: npm run native:build

      - run: npm run electron:build

      - name: Soak
        run: node scripts/soak-video.js --minutes=${{ inputs.minutes }} --warmup-min=3 --reopen-min=3 --file=test/e2e/fixtures/sample.mp4 --out=soak-macos

      - name: Upload soak results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: soak-macos
          path: soak-macos.*
          retention-days: 14
          if-no-files-found: ignore
