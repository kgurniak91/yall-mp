name: E2E

on:
  push:
    branches: [ master, 'feature/**' ]
  pull_request:
  workflow_dispatch:
    inputs:
      soak_minutes:
        description: 'Length of the macOS soak job in minutes (0 skips it)'
        default: '10'

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ${{ matrix.os }}
    # Linux/macOS record the known-broken baseline of the stacked-window design; only Windows gates
    continue-on-error: ${{ matrix.os != 'windows-latest' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ windows-latest, ubuntu-latest, macos-latest ]
    env:
      E2E_RECORD_DESKTOP: '1'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig1-dev xvfb openbox
          # Ubuntu 24.04 AppArmor blocks the Chromium/Electron sandbox
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          sudo add-apt-repository -y ppa:chris-needham/ppa
          sudo apt-get update
          sudo apt-get install -y audiowaveform
          sudo add-apt-repository -y ppa:ubuntuhandbook1/mpv
          sudo apt-get update
          sudo apt-get install -y mpv libmpv-dev
          Xvfb :99 -screen 0 1920x1080x24 &
          sleep 2
          DISPLAY=:99 openbox &
          echo "DISPLAY=:99" >> "$GITHUB_ENV"

      - name: Install macOS dependencies
        if: matrix.os == 'macos-latest'
        run: |
          brew install mpv cmake
          brew tap bbc/audiowaveform
          brew install audiowaveform

      - name: Set Windows display resolution
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          try { Set-DisplayResolution -Width 1920 -Height 1080 -Force } catch { Write-Host "Could not change resolution: $_" }

      - name: Cache downloaded binaries
        uses: actions/cache@v4
        with:
          path: electron-resources
          key: electron-resources-${{ runner.os }}-${{ hashFiles('scripts/download-dependencies.js') }}

      - run: npm ci

      # Windows/macOS build the addon, Linux the yall-mpv-host executable
      - name: Build the native addon
        run: npm run native:build

      - name: Log libmpv version
        shell: bash
        run: |
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            cat ./electron-resources/windows/libmpv-2.dll.version || true
          else
            mpv --version | sed -n 1p || true
          fi

      - run: npx tsc --noEmit -p test/e2e

      - run: npm run electron:build

      - run: npx playwright test --grep-invert @os-input

      # Real mouse input: the hosted Windows runner has no GPU and paints the transparent UI window white, so this only runs for the record
      - name: OS-input specs (non-gating)
        if: matrix.os == 'windows-latest'
        continue-on-error: true
        run: npx playwright test --grep @os-input

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-${{ matrix.os }}
          path: |
            playwright-report/
            test-results/
            e2e-artifacts/
          retention-days: 14
          if-no-files-found: ignore

  # Manual only: memory and leak counters of the video path over a looped playback on the hosted macOS runner (software GL, readback)
  soak:
    if: github.event_name == 'workflow_dispatch' && inputs.soak_minutes != '0'
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install macOS dependencies
        run: brew install mpv cmake

      - run: npm ci

      - run: npm run native:build

      - run: npm run electron:build

      - name: Soak
        run: node scripts/soak-video.js --minutes=${{ inputs.soak_minutes }} --warmup-min=3 --reopen-min=3 --file=test/e2e/fixtures/sample.mp4 --out=soak-macos

      - name: Upload soak results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: soak-macos
          path: soak-macos.*
          retention-days: 14
          if-no-files-found: ignore
