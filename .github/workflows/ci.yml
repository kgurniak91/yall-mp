name: CI

on:
  push:
    branches: [ master, 'feature/**' ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ windows-latest, ubuntu-latest, macos-latest ]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Required for 'font-scanner' to compile during npm install
      - name: Install Linux Build Dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig1-dev
          # Ubuntu 24.04 AppArmor blocks Chrome's sandbox (needed by Karma ChromeHeadless)
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Cache downloaded binaries
        uses: actions/cache@v4
        with:
          path: electron-resources
          key: electron-resources-${{ runner.os }}-${{ hashFiles('scripts/download-dependencies.js') }}

      - run: npm ci

      - run: npm run test:electron

      - run: npm run test:angular

  package-smoke:
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest ]
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: false

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Linux Build Dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig1-dev libarchive-tools

      - name: Cache downloaded binaries
        uses: actions/cache@v4
        with:
          path: electron-resources
          key: electron-resources-${{ runner.os }}-${{ hashFiles('scripts/download-dependencies.js') }}

      - run: npm ci

      - run: npm run electron:build

      - run: npx electron-builder --dir --publish never

      - name: Verify extraResources were packaged
        shell: bash
        run: |
          if [ "${{ matrix.os }}" = "ubuntu-latest" ]; then
            RES=dist_electron/linux-unpacked/resources
          else
            RES=$(echo dist_electron/mac*/*.app/Contents/Resources)
          fi
          echo "Resources dir: $RES"
          ls -la "$RES"
          test -f "$RES/mpv/yall_auto_pause.lua"
          test -f "$RES/electron-resources/extensions/yomitan/manifest.json"
          test -f "$RES/THIRD-PARTY-NOTICES.txt"

  native:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ windows-latest, ubuntu-latest, macos-latest ]
    env:
      YALL_NATIVE_REQUIRED: 1

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig1-dev xvfb
          # Ubuntu 24.04 AppArmor blocks the Electron sandbox
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          sudo add-apt-repository -y ppa:ubuntuhandbook1/mpv
          sudo apt-get update
          sudo apt-get install -y mpv libmpv-dev

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: brew install mpv cmake

      - name: Cache downloaded binaries
        uses: actions/cache@v4
        with:
          path: electron-resources
          key: electron-resources-${{ runner.os }}-${{ hashFiles('scripts/download-dependencies.js') }}

      - run: npm ci

      - name: Toolchain versions
        shell: bash
        run: |
          cmake --version || true
          mpv --version | head -n 1 || true
          ls -la electron-resources/windows/libmpv-2.dll* 2>/dev/null || true

      - run: npm run native:build -- --prebuild

      - uses: actions/upload-artifact@v4
        with:
          name: yall-libmpv-${{ runner.os }}-${{ runner.arch }}
          path: |
            native/yall-libmpv/prebuilds/
            native/yall-libmpv/include/mpv/VENDORED.md

      - run: npm run test:native

      - name: Electron smoke (non-gating)
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p test-results/smoke
          if [ "${{ runner.os }}" = "Windows" ]; then
            npm run test:native:smoke -- --backend=auto --adapter=default --seconds=6 --mpv-log=v --json=test-results/smoke/windows.json
          elif [ "${{ runner.os }}" = "Linux" ]; then
            # Known-blocked: libmpv inside the Electron main process exits in mpv_initialize because it binds to Electron's
            # bundled libffmpeg.so (libavcodec 63) instead of the system libavcodec 60. The diagnostics below keep that evidence
            # in the log; the probe is expected to fail under Electron and pass under plain node.
            echo "::group::ffmpeg scope diagnostics (expected: node ok, Electron fails)"
            ELECTRON_BIN=node_modules/electron/dist/electron
            ldd "$ELECTRON_BIN" | grep -iE "ffmpeg|libav" || echo "ldd: no ffmpeg/libav entry"
            echo "--- probe under plain node"
            node test/native/support/ffmpeg-scope-probe.js 2>&1 | grep -v "dbus" | tail -25 || echo "node probe exit $?"
            echo "--- probe as Electron main (LD_DEBUG=bindings)"
            mkdir -p "$RUNNER_TEMP/ld"
            LD_DEBUG=bindings LD_DEBUG_OUTPUT="$RUNNER_TEMP/ld/main" xvfb-run -a -s "-screen 0 1920x1080x24" "$ELECTRON_BIN" test/native/support/ffmpeg-scope-probe.js --no-sandbox 2>&1 | grep -v "dbus" | tail -25 || echo "electron probe exit $?"
            grep -hE "avcodec_version|avutil_version" "$RUNNER_TEMP"/ld/main.* 2>/dev/null | head -4 || true
            echo "::endgroup::"
            echo "Linux Electron smoke skipped: libmpv in the Electron main process is unsupported on Linux for now"
          else
            npm run test:native:smoke -- --backend=readback --seconds=4 --min-fps=10 --json=test-results/smoke/macos.json
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-smoke-${{ runner.os }}
          path: test-results/smoke/
          if-no-files-found: ignore
