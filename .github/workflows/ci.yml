name: CI

on:
  push:
    branches: [ master, 'feature/**' ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ windows-latest, ubuntu-latest, macos-latest ]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Required for 'font-scanner' to compile during npm install
      - name: Install Linux Build Dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig1-dev
          # Ubuntu 24.04 AppArmor blocks Chrome's sandbox (needed by Karma ChromeHeadless)
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Cache downloaded binaries
        uses: actions/cache@v4
        with:
          path: electron-resources
          key: electron-resources-${{ runner.os }}-${{ hashFiles('scripts/download-dependencies.js') }}

      - run: npm ci

      - run: npm run test:electron

      - run: npm run test:angular

  package-smoke:
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest ]
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: false

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Linux Build Dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig1-dev libarchive-tools

      - name: Cache downloaded binaries
        uses: actions/cache@v4
        with:
          path: electron-resources
          key: electron-resources-${{ runner.os }}-${{ hashFiles('scripts/download-dependencies.js') }}

      - run: npm ci

      # macOS packages the addon, Linux the libmpv host executable
      - name: Build the native addon
        if: matrix.os == 'macos-latest'
        run: |
          brew install cmake
          npm run native:build

      - name: Build the libmpv host
        if: matrix.os == 'ubuntu-latest'
        run: npm run native:build

      - run: npm run electron:build

      - run: npx electron-builder --dir --publish never

      - name: Verify extraResources were packaged
        shell: bash
        run: |
          if [ "${{ matrix.os }}" = "ubuntu-latest" ]; then
            RES=dist_electron/linux-unpacked/resources
          else
            RES=$(echo dist_electron/mac*/*.app/Contents/Resources)
          fi
          echo "Resources dir: $RES"
          ls -la "$RES"
          test -f "$RES/mpv/yall_auto_pause.lua"
          test -f "$RES/electron-resources/extensions/yomitan/manifest.json"
          test -f "$RES/THIRD-PARTY-NOTICES.txt"
          if [ "${{ matrix.os }}" = "macos-latest" ]; then
            find dist_electron/mac*/*.app -name yall_libmpv.node | grep -q .
          else
            test -x "$RES/yall-mpv-host"
          fi

  native:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ windows-latest, ubuntu-latest, macos-latest ]
    env:
      YALL_NATIVE_REQUIRED: 1

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig1-dev xvfb
          # Ubuntu 24.04 AppArmor blocks the Electron sandbox
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          sudo add-apt-repository -y ppa:ubuntuhandbook1/mpv
          sudo apt-get update
          sudo apt-get install -y mpv libmpv-dev

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: brew install mpv cmake

      - name: Cache downloaded binaries
        uses: actions/cache@v4
        with:
          path: electron-resources
          key: electron-resources-${{ runner.os }}-${{ hashFiles('scripts/download-dependencies.js') }}

      - run: npm ci

      - name: Toolchain versions
        shell: bash
        run: |
          cmake --version || true
          mpv --version | head -n 1 || true
          ls -la electron-resources/windows/libmpv-2.dll* 2>/dev/null || true

      - run: npm run native:build -- --prebuild

      - uses: actions/upload-artifact@v4
        with:
          name: yall-libmpv-${{ runner.os }}-${{ runner.arch }}
          path: |
            native/yall-libmpv/prebuilds/
            native/yall-libmpv/include/mpv/VENDORED.md

      - run: npm run test:native
        if: runner.os != 'macOS'

      # No Mac to look at: this run is the evidence for the iosurface-shared backend. It never stops the job, so the
      # smoke runs below always happen; the log (GL version/renderer, pixel values, GL errors) is uploaded.
      - name: Native tests (macOS)
        if: runner.os == 'macOS'
        continue-on-error: true
        env:
          YALL_MP_GL_DEBUG: 1
        run: |
          mkdir -p test-results/smoke
          { sw_vers; uname -m; system_profiler SPDisplaysDataType; } > test-results/smoke/macos-system.txt 2>&1 || true
          set -o pipefail
          npm run test:native 2>&1 | tee test-results/smoke/native-tests-macos.log

      - name: Electron smoke (non-gating)
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p test-results/smoke
          if [ "${{ runner.os }}" = "Windows" ]; then
            npm run test:native:smoke -- --backend=auto --adapter=default --seconds=6 --mpv-log=v --json=test-results/smoke/windows.json
          elif [ "${{ runner.os }}" = "Linux" ]; then
            # libmpv runs in the yall-mpv-host process, so Electron's bundled ffmpeg does not interfere.
            xvfb-run -a -s "-screen 0 1920x1080x24" npm run test:native:smoke -- --backend=readback --seconds=4 --min-fps=10 --no-sandbox --json=test-results/smoke/linux.json
          else
            export YALL_MP_GL_DEBUG=1
            status=0
            npm run test:native:smoke -- --backend=readback --seconds=4 --min-fps=10 --json=test-results/smoke/macos.json || status=1
            npm run test:native:smoke -- --backend=iosurface-shared --allow-fallback --seconds=6 --mpv-log=v --screenshot=test-results/smoke/macos-iosurface.png --json=test-results/smoke/macos-iosurface.json || status=1
            npm run test:native:smoke -- --backend=auto --allow-fallback --seconds=6 --screenshot=test-results/smoke/macos-auto.png --json=test-results/smoke/macos-auto.json || status=1
            exit $status
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-smoke-${{ runner.os }}
          path: test-results/smoke/
          if-no-files-found: ignore
