<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Subtitles Lookup</title>
  <style>
    :root {
      --bg-color: #ffffff;
      --text-color: #000000;
      --error-bg: #f3f4f6;
      --error-border: #d1d5db;
      --error-text: #374151;
      --error-hint: #4b5563;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg-color: #1e1e1e;
        --text-color: #ceced1;
        --error-bg: #2d2d2d;
        --error-border: #4a4a4a;
        --error-text: #ceced1;
        --error-hint: #9ca3af;
      }
    }

    body {
      margin: 0;
      font-family: Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      height: 100vh;
      background-color: var(--bg-color);
      color: var(--text-color);
    }

    #title-bar {
      height: 2.5rem;
      background-color: #1e1e1eff;
      border-bottom: 1px solid #4a4a4a;
      display: flex;
      align-items: center;
      padding: 0 0.5rem;
      flex-shrink: 0;
      -webkit-user-select: none;
    }

    #title {
      font-weight: 600;
      font-size: 1rem;
      color: #ceced1;
    }

    #title-bar-drag-region {
      flex-grow: 1;
      height: 100%;
      -webkit-app-region: drag;
    }

    #close-btn {
      -webkit-app-region: no-drag;
      border: none;
      background: transparent;
      color: #dc2626;
      font-size: 1.5rem;
      line-height: 1;
      padding: 0;
      width: 1.5rem;
      height: 1.5rem;
      cursor: pointer;
    }

    #close-btn:hover {
      background-color: #fef2f2;
    }

    #close-btn:focus {
      outline: none !important;
    }

    #main-content {
      flex-grow: 1;
      position: relative;
    }

    #spinner-container {
      position: absolute;
      inset: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: var(--bg-color);
      z-index: 10;
    }

    .hidden {
      display: none !important;
    }

    .lds-spinner,
    .lds-spinner div,
    .lds-spinner div:after {
      box-sizing: border-box;
    }

    .lds-spinner {
      display: inline-block;
      position: relative;
      width: 5rem;
      height: 5rem;
    }

    .lds-spinner div {
      transform-origin: 2.5rem 2.5rem;
      animation: lds-spinner 1.2s linear infinite;
    }

    .lds-spinner div:after {
      content: " ";
      display: block;
      position: absolute;
      top: 0.2rem;
      left: 2.3rem;
      width: 0.4rem;
      height: 1.1rem;
      border-radius: 20%;
      background: currentColor;
    }

    .lds-spinner div:nth-child(1) {
      transform: rotate(0deg);
      animation-delay: -1.1s;
    }

    .lds-spinner div:nth-child(2) {
      transform: rotate(30deg);
      animation-delay: -1s;
    }

    .lds-spinner div:nth-child(3) {
      transform: rotate(60deg);
      animation-delay: -0.9s;
    }

    .lds-spinner div:nth-child(4) {
      transform: rotate(90deg);
      animation-delay: -0.8s;
    }

    .lds-spinner div:nth-child(5) {
      transform: rotate(120deg);
      animation-delay: -0.7s;
    }

    .lds-spinner div:nth-child(6) {
      transform: rotate(150deg);
      animation-delay: -0.6s;
    }

    .lds-spinner div:nth-child(7) {
      transform: rotate(180deg);
      animation-delay: -0.5s;
    }

    .lds-spinner div:nth-child(8) {
      transform: rotate(210deg);
      animation-delay: -0.4s;
    }

    .lds-spinner div:nth-child(9) {
      transform: rotate(240deg);
      animation-delay: -0.3s;
    }

    .lds-spinner div:nth-child(10) {
      transform: rotate(270deg);
      animation-delay: -0.2s;
    }

    .lds-spinner div:nth-child(11) {
      transform: rotate(300deg);
      animation-delay: -0.1s;
    }

    .lds-spinner div:nth-child(12) {
      transform: rotate(330deg);
      animation-delay: 0s;
    }

    @keyframes lds-spinner {
      0% {
        opacity: 1;
      }
      100% {
        opacity: 0;
      }
    }

    #footer {
      height: 2.5rem;
      background-color: #1e1e1eff;
      border-top: 1px solid #4a4a4a;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
      padding: 0;
      color: #ceced1;
      flex-shrink: 0;
      -webkit-user-select: none;
    }

    #footer.toast-active {
      background-color: #16A34A;
      color: white;
      font-weight: bold;
      animation: footer-flash-fade 3s cubic-bezier(0.4, 0, 0.2, 1) forwards;
    }

    @keyframes footer-flash-fade {
      0% {
        background-color: #16A34A;
      }
      100% {
        background-color: #1e1e1e;
      }
    }

    #help-text {
      margin: 0;
    }

    #nav-controls {
      display: flex;
      align-items: center;
      margin-left: 0.5rem;
      -webkit-app-region: no-drag;
    }

    .nav-btn {
      background: transparent;
      border: none;
      color: #ceced1;
      cursor: pointer;
      font-size: 1rem;
      padding: 0.25rem;
      margin-right: 0.25rem;
      opacity: 0.5;
      transition: opacity 0.2s;
    }

    .nav-btn:hover:not(:disabled) {
      color: #ffffff;
      opacity: 1;
    }

    .nav-btn:disabled {
      cursor: default;
      opacity: 0.2;
    }

    #loading-message {
      margin-top: 1rem;
      color: #666;
      font-size: 0.9rem;
      font-weight: bold;
    }

    #spinner-content {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    #error-container {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background-color: var(--bg-color);
      z-index: 20;
      padding: 2rem;
      text-align: center;
    }

    .error-icon {
      font-size: 3rem;
      margin-bottom: 1rem;
    }

    .error-title {
      font-size: 1.5rem;
      font-weight: bold;
      color: #dc2626;
      margin-bottom: 1rem;
    }

    .error-details {
      background-color: var(--error-bg);
      border: 1px solid var(--error-border);
      border-radius: 0.5rem;
      padding: 1rem;
      width: 100%;
      max-width: 600px;
      word-break: break-all;
      margin-bottom: 1.5rem;
      font-family: monospace;
      color: var(--error-text);
    }

    .error-hint {
      font-size: 1rem;
      color: var(--error-hint);
      line-height: 1.5;
    }
  </style>
</head>
<body>
<div id="title-bar">
  <span id="title">Subtitles Lookup</span>
  <div id="nav-controls" class="hidden">
    <button id="back-btn" class="nav-btn" title="Back" disabled>&#9664;</button>
    <button id="forward-btn" class="nav-btn" title="Forward" disabled>&#9654;</button>
  </div>
  <div id="title-bar-drag-region"></div>
  <button id="close-btn" title="Close">&times;</button>
</div>

<div id="main-content">
  <div id="spinner-container">
    <div id="spinner-content">
      <div class="lds-spinner">
        <div></div>
        <div></div>
        <div></div>
        <div></div>
        <div></div>
        <div></div>
        <div></div>
        <div></div>
        <div></div>
        <div></div>
        <div></div>
        <div></div>
      </div>
      <div id="loading-message">
        Loading...
      </div>
    </div>
  </div>

  <div id="error-container" class="hidden">
    <div class="error-icon">⚠️</div>
    <div class="error-title">Page Load Failed</div>
    <div class="error-details">
      <div style="font-weight: bold; margin-bottom: 0.5rem;" id="error-desc"></div>
      <div id="error-url"></div>
    </div>
    <div class="error-hint">
      Fix the URL template in the <b>Global Settings</b> dialog and try again.
    </div>
  </div>
</div>

<div id="footer">
  <p id="help-text">
    <b>Tip:</b> Select text and click <b>right mouse button</b> or use <b>Ctrl+S</b> to add <b>clip notes</b> for <b>Anki export</b>.
  </p>
</div>

<script>
  let toastTimeout;
  const originalHelpTextHTML = document.getElementById('help-text').innerHTML;

  function showToast(message) {
    const footer = document.getElementById('footer');
    const helpText = document.getElementById('help-text');
    if (!footer || !helpText) {
      return;
    }

    clearTimeout(toastTimeout);

    // Remove the class to stop any existing animation
    footer.classList.remove('toast-active');

    // Force reflow and recalculate styles
    void footer.offsetWidth;

    // Instantly change the footer's content and appearance
    helpText.textContent = message;
    footer.classList.add('toast-active');

    // Set a timer to revert the changes after 3 seconds
    toastTimeout = setTimeout(() => {
      footer.classList.remove('toast-active');
      helpText.innerHTML = originalHelpTextHTML;
    }, 3000);
  }

  // Listen for toast events from the main process
  window.electronAPI.onLookupShowToast((message) => {
    showToast(message);
  });

  // Update Loading Message
  window.electronAPI.onLoadingMessageUpdate((message) => {
    const el = document.getElementById('loading-message');
    if (el) {
      el.textContent = message || 'Loading...';
    }
  });

  // Listen for navigation state changes
  window.electronAPI.onNavigationStateChange((state) => {
    const navControls = document.getElementById('nav-controls');
    const backBtn = document.getElementById('back-btn');
    const fwdBtn = document.getElementById('forward-btn');

    if (state.canGoBack || state.canGoForward) {
      navControls.classList.remove('hidden');
      backBtn.disabled = !state.canGoBack;
      fwdBtn.disabled = !state.canGoForward;
    } else {
      navControls.classList.add('hidden');
    }
  });

  // Wire up navigation buttons
  document.getElementById('back-btn').addEventListener('click', () => {
    window.electronAPI.lookupGoBack();
  });

  document.getElementById('forward-btn').addEventListener('click', () => {
    window.electronAPI.lookupGoForward();
  });

  // Listen for events from the main process to show/hide the spinner
  window.electronAPI.onViewLoadingStateChange((isLoading) => {
    const spinner = document.getElementById('spinner-container');
    const errorContainer = document.getElementById('error-container');

    if (isLoading) {
      if (spinner) {
        spinner.classList.remove('hidden');
      }
      if (errorContainer) {
        errorContainer.classList.add('hidden');
      }
    } else {
      // If loading failed, the onLookupLoadError listener will unhide the error container separately
      if (spinner) {
        spinner.classList.add('hidden');
      }
    }
  });

  document.getElementById('close-btn').addEventListener('click', () => {
    window.electronAPI.closeLookupWindow();
  });

  document.addEventListener('keydown', (event) => {
    if (event.key === 'Escape') {
      event.preventDefault();
      window.electronAPI.closeLookupWindow();
    }
  });

  window.electronAPI.onLookupLoadError((error) => {
    // Hide spinner
    const spinner = document.getElementById('spinner-container');
    if (spinner) {
      spinner.classList.add('hidden');
    }

    // Show error
    const errorContainer = document.getElementById('error-container');
    const errorDesc = document.getElementById('error-desc');
    const errorUrl = document.getElementById('error-url');

    if (errorContainer && errorDesc && errorUrl) {
      errorDesc.textContent = `Error: ${error.description}`;
      errorUrl.innerHTML = `<b>URL:</b> "${error.url}"`;
      errorContainer.classList.remove('hidden');
    }
  });
</script>
</body>
</html>
